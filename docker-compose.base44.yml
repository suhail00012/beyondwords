# Base44 sandbox environment for the Beyondwords repository.
#
# Beyondwords is a Python 3.11+ local toolkit plus an assistant skill: no
# hosted backend, no web UI, no bundled model. This environment runs the
# project's own CLI from the bind-mounted source and serves a read-only
# preview of its real output on host port 3000 (preview/server.py).
name: app

services:
  toolkit:
    image: python:3.12-slim
    working_dir: /workspace
    command: ["sh", "-ec", "/config/preview/entrypoint.sh"]
    restart: on-failure
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PIP_DISABLE_PIP_VERSION_CHECK=1
      - PIP_NO_INPUT=1
      - PIP_ROOT_USER_ACTION=ignore
      - BEYONDWORDS_RUNTIME=/runtime/venv
      - BEYONDWORDS_PYTHON=/runtime/venv/bin/python
      - BEYONDWORDS_CLI=/workspace/.agents/skills/beyondwords/scripts/beyondwords.py
      - BEYONDWORDS_SCRIPTS=/workspace/.agents/skills/beyondwords/scripts
      - BEYONDWORDS_WORKSPACE=/data/workspace
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - ${BASE44_CONFIG_ROOT}:/config:ro
      - deps:/runtime
      - bwdata:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/healthz',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s
    labels:
      base44.project: "Beyondwords Toolkit"
      base44.kind: "api"
      base44.port: "3000"

volumes:
  deps:
  bwdata:
